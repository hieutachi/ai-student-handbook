<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="token-context-title token-context-desc" xml:lang="vi"><title id="token-context-title">Một câu hỏi, nhiều mảnh nhỏ</title><desc id="token-context-desc">Năm lát cắt giả định minh họa token, không phải tokenizer thật. Cửa sổ hữu hạn có chỉ dẫn, dữ liệu, hội thoại và phần dành cho đầu ra; nội dung ngoài cửa sổ không tự được nhớ.</desc><defs><marker id="token-context-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="token-context-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="token-context-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">BEHIND THE SCENE / TOKEN &amp; CONTEXT</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Một câu hỏi, nhiều mảnh nhỏ</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Các lát cắt dưới đây chỉ minh họa; không phải kết quả tokenizer thật.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><path d="M84 228 H236 L228 307 H76 Z" fill="#f2dfa5" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="156.0" y="278" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="32" font-weight="400" text-anchor="middle"><tspan x="156.0" dy="0">Tính</tspan></text><path d="M256 228 H420 L412 307 H248 Z" fill="#f2dfa5" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="334.0" y="278" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="32" font-weight="400" text-anchor="middle"><tspan x="334.0" dy="0">tổng</tspan></text><path d="M440 228 H544 L536 307 H432 Z" fill="#f2dfa5" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="488.0" y="278" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="32" font-weight="400" text-anchor="middle"><tspan x="488.0" dy="0">[</tspan></text><path d="M564 228 H870 L862 307 H556 Z" fill="#f2dfa5" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="713.0" y="278" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="32" font-weight="400" text-anchor="middle"><tspan x="713.0" dy="0">7000</tspan></text><path d="M890 228 H1124 L1116 307 H882 Z" fill="#f2dfa5" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="1003.0" y="278" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="32" font-weight="400" text-anchor="middle"><tspan x="1003.0" dy="0">]</tspan></text><text x="600" y="347" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Không suy ra số token hay chi phí từ hình này.</tspan></text><g transform="translate(64 415)"><path d="M0 0 H156 L180 24 V146 H0 Z" fill="#f6f3ea" stroke="#58685f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M156 0 V24 H180" fill="none" stroke="#58685f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="18" y="46" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="18" dy="0">Nội dung</tspan><tspan x="18" dy="32">ngoài cửa sổ</tspan></text><line x1="18" y1="107" x2="147" y2="107" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /></g><rect x="300" y="411" width="836" height="151" rx="0" fill="#dce8d0" /><path d="M318 395 H300 V578 H318 M1118 395 H1136 V578 H1118" fill="none" stroke="#35634b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="719" y="393" fill="#35634b" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="719" dy="0">CỬA SỔ NGỮ CẢNH HỮU HẠN</tspan></text><rect x="861" y="412" width="274" height="149" rx="0" fill="#f2dfa5" /><line x1="545" y1="430" x2="545" y2="544" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><line x1="859" y1="430" x2="859" y2="544" stroke="#35634b" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" /><text x="330" y="469" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="330" dy="0">Chỉ dẫn</tspan><tspan x="330" dy="36">đang có</tspan></text><text x="575" y="469" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" text-anchor="start"><tspan x="575" dy="0">Dữ liệu + hội thoại</tspan><tspan x="575" dy="36">được đưa vào</tspan></text><text x="886" y="469" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" text-anchor="start"><tspan x="886" dy="0">Phần dành cho</tspan><tspan x="886" dy="36">đầu ra</tspan></text><line x1="264" y1="477" x2="280" y2="493" stroke="#b95132" stroke-width="3" stroke-linecap="round" /><line x1="264" y1="493" x2="280" y2="477" stroke="#b95132" stroke-width="3" stroke-linecap="round" /><text x="64" y="610" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Không tự nhớ phần bị bỏ.</tspan></text><text x="536" y="610" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="536" dy="0">Giới hạn và cách tính tùy model / dịch vụ.</tspan></text><line x1="64" y1="644" x2="1136" y2="644" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="680" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Cần dữ kiện nào? Hãy kiểm tra nó thực sự có trong context.</tspan></text><text x="1136" y="680" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="end"><tspan x="1136" dy="0">HỌC CNTT CÙNG AI</tspan></text></svg>
