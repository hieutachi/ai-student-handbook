<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="ai-trap-title ai-trap-desc" xml:lang="vi"><title id="ai-trap-title">Một ca đúng chưa đủ</title><desc id="ai-trap-desc">Lời AI giả lập sai: mảng rỗng ra 0 nên vòng lặp đúng. Phản ví dụ [7000] với i=0, n=1, cận i&lt;n-1 làm 0&lt;0 sai: thực tế 0, kỳ vọng 7000.</desc><defs><marker id="ai-trap-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="ai-trap-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="ai-trap-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">AI TRAP / PHẢN VÍ DỤ</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Một ca đúng chưa đủ</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Đối chiếu lời tự tin bằng dữ liệu nhỏ nhất có thể bác bỏ nó.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="63" y="323" fill="#b95132" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="400" text-anchor="start"><tspan x="63" dy="0">“</tspan></text><text x="128" y="280" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="128" dy="0">Mảng rỗng ra 0,</tspan><tspan x="128" dy="48">nên vòng lặp đúng.</tspan></text><text x="128" y="397" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="128" dy="0">LỜI AI GIẢ LẬP / KẾT LUẬN SAI</tspan></text><line x1="128" y1="438" x2="536" y2="438" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="128" y="486" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="34" font-weight="400" text-anchor="start"><tspan x="128" dy="0">[] → 0</tspan></text><text x="128" y="536" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="128" dy="0">Chỉ một ca đi qua.</tspan><tspan x="128" dy="34">Chưa kiểm tra phần tử cuối.</tspan></text><line x1="596" y1="224" x2="596" y2="607" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="660" y="247" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="660" dy="0">THỬ MỘT PHẦN TỬ</tspan></text><path d="M701 278 H681 V345 H701 M1033 278 H1053 V345 H1033" fill="none" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="740" y="278" width="252" height="67" rx="0" fill="#f2dfa5" /><text x="866" y="324" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="34" font-weight="400" text-anchor="middle"><tspan x="866" dy="0">7000</tspan></text><text x="660" y="394" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="24" font-weight="400" text-anchor="start"><tspan x="660" dy="0">n = 1 → i &lt; n - 1</tspan></text><text x="660" y="434" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="23" font-weight="400" text-anchor="start"><tspan x="660" dy="0">i = 0: 0 &lt; 0 là sai</tspan></text><line x1="660" y1="459" x2="1120" y2="459" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="660" y="499" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="660" dy="0">TRACE BẢN SAI</tspan></text><text x="660" y="550" fill="#b95132" font-family="ui-monospace, Consolas, monospace" font-size="42" font-weight="400" text-anchor="start"><tspan x="660" dy="0">0</tspan></text><line x1="733" y1="522" x2="755" y2="544" stroke="#b95132" stroke-width="3" stroke-linecap="round" /><line x1="733" y1="544" x2="755" y2="522" stroke="#b95132" stroke-width="3" stroke-linecap="round" /><text x="897" y="499" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="897" dy="0">KỲ VỌNG</tspan></text><text x="897" y="550" fill="#35634b" font-family="ui-monospace, Consolas, monospace" font-size="42" font-weight="400" text-anchor="start"><tspan x="897" dy="0">7000</tspan></text><text x="660" y="603" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" text-anchor="start"><tspan x="660" dy="0">Phản ví dụ bác bỏ kết luận.</tspan></text><line x1="64" y1="644" x2="1136" y2="644" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="680" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Vòng lặp lỗi đang xét: i bắt đầu từ 0, điều kiện i &lt; n - 1.</tspan></text></svg>
