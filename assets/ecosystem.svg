<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="ecosystem-title ecosystem-desc" xml:lang="vi"><title id="ecosystem-title">Nhiều lối vào, khác điều kiện</title><desc id="ecosystem-desc">Chat web, API và trợ lý IDE đi qua cổng dịch vụ tới model từ xa; một nhánh riêng chạy model trên máy. Không có thứ hạng thương hiệu.</desc><defs><marker id="ecosystem-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="ecosystem-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="ecosystem-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">AI MAP / CÁCH TRUY CẬP</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Nhiều lối vào, khác điều kiện</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Đường truy cập không phải bảng xếp hạng chất lượng hay thương hiệu.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><path d="M471 265 H590 Q651 265 695 363 H754" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ecosystem-green)" /><path d="M471 363 H590 Q651 363 695 363 H754" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ecosystem-green)" /><path d="M471 461 H590 Q651 461 695 363 H754" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ecosystem-green)" /><g transform="translate(78 238)"><rect x="0" y="0" width="76" height="48" rx="4" fill="#dce8d0" stroke="#20342d" stroke-width="2" /><line x1="0" y1="12" x2="76" y2="12" stroke="#20342d" stroke-width="2" stroke-linecap="round" /><path d="M14 23 H59 V36 H35 L24 44 V36 H14 Z" fill="#f6f3ea" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="182" y="258" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="182" dy="0">Chat trên web</tspan></text><text x="182" y="286" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="182" dy="0">Nhập câu hỏi qua giao diện</tspan></text><rect x="78" y="337" width="76" height="48" rx="4" fill="#dce8d0" stroke="#20342d" stroke-width="2" /><path d="M101 350 l-10 10 10 10 M132 350 l10 10 -10 10 M121 347 l-8 25" fill="none" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="182" y="356" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="182" dy="0">Gọi API</tspan></text><text x="182" y="384" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="182" dy="0">Mã gửi request tới dịch vụ</tspan></text><rec