<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="workflow-title workflow-desc" xml:lang="vi"><title id="workflow-title">Điều khiển, không phó mặc</title><desc id="workflow-desc">Ask sang Analyze, Edit, Test, Review. Test sai quay lại Analyze; đổi yêu cầu hoặc phát hiện thiếu sau review quay lại Ask.</desc><defs><marker id="workflow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="workflow-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="workflow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">MISSION / VÒNG LÀM VIỆC</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Điều khiển, không phó mặc</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Bản sửa phải qua test và review; câu trả lời tự tin không thay bằng chứng.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><path d="M830 277 V244 Q830 229 815 229 H389 Q370 229 370 249 V277" fill="none" stroke="#b95132" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#workflow-rust)" /><text x="600" y="219" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Test sai → phân tích lại</tspan></text><path d="M202 344 H308" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#workflow-green)" /><path d="M432 344 H538" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#workflow-green)" /><path d="M662 344 H768" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#workflow-green)" /><path d="M892 344 H998" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#workflow-green)" /><circle cx="140" cy="344" r="59" fill="#f2dfa5" stroke="#35634b" stroke-width="2" /><text x="202" y="274" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="202" dy="0">01</tspan></text><circle cx="370" cy="344" r="59" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="432" y="274" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="432" dy="0">02</tspan></text><circle cx="600" cy="344" r="59" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="662" y="274" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="662" dy="0">03</tspan></text><circle cx="830" cy="344" r="59" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="892" y="274" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="892" dy="0">04</tspan></text><circle cx="1060" cy="344" r="59" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="1122" y="274" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="1122" dy="0">05</tspan></text><text x="140" y="363" fill="#35634b" font-family="Georgia, 'Times New Roman', serif" font-size="57" font-weight="400" text-anchor="middle"><tspan x="140" dy="0">?</tspan></text><path d="M344 361 L358 338 L373 348 L395 320 M350 316 H389" fill="none" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M578 364 L586 343 L610 319 L624 333 L600 358 Z M588 342 L602 356" fill="#f6f3ea" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M807 316 H850 M817 317 V340 L799 366 Q829 383 859 366 L841 340 V317" fill="#f6f3ea" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M819.0 356 l8.0 8.0 l15.0 -18.0" fill="none" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1035 314 H1085 V375 H1035 Z" fill="#f6f3ea" stroke="#35634b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M1042.0 329 l3.2 3.2 l6.0 -7.2" fill="none" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="1060" y1="329" x2="1075" y2="329" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><path d="M1042.0 348 l3.2 3.2 l6.0 -7.2" fill="none" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="1060" y1="348" x2="1075" y2="348" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><path d="M1042.0 367 l3.2 3.2 l6.0 -7.2" fill="none" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="1060" y1="367" x2="1075" y2="367" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><text x="140" y="449" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="400" text-anchor="middle"><tspan x="140" dy="0">Ask</tspan></text><text x="140" y="488" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="140" dy="0">Nêu mục tiêu</tspan><tspan x="140" dy="31">và giới hạn</tspan></text><text x="370" y="449" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="400" text-anchor="middle"><tspan x="370" dy="0">Analyze</tspan></text><text x="370" y="488" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="370" dy="0">Đọc bằng chứng</tspan><tspan x="370" dy="31">tìm nguyên nhân</tspan></text><text x="600" y="449" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Edit</tspan></text><text x="600" y="488" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Sửa tối thiểu</tspan><tspan x="600" dy="31">trong phạm vi</tspan></text><text x="830" y="449" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="400" text-anchor="middle"><tspan x="830" dy="0">Test</tspan></text><text x="830" y="488" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="830" dy="0">Chạy lại</tspan><tspan x="830" dy="31">đối chiếu kỳ vọng</tspan></text><text x="1060" y="449" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="400" text-anchor="middle"><tspan x="1060" dy="0">Review</tspan></text><text x="1060" y="488" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="1060" dy="0">Đọc diff</tspan><tspan x="1060" dy="31">tự giải thích</tspan></text><text x="945" y="329" fill="#35634b" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="945" dy="0">Đạt</tspan></text><path d="M1060 552 V581 Q1060 597 1040 597 H160 Q140 597 140 577 V552" fill="none" stroke="#20342d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#workflow-ink)" /><text x="600" y="584" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Đổi yêu cầu hoặc phát hiện thiếu → hỏi lại</tspan></text><line x1="64" y1="644" x2="1136" y2="644" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="680" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Mỗi lượt: lưu bằng chứng, không chỉ lưu câu trả lời.</tspan></text><text x="1136" y="680" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="end"><tspan x="1136" dy="0">HỌC CNTT CÙNG AI</tspan></text></svg>
