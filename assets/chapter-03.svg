"0">Lan giải thích</tspan></text><text x="26" y="262" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="26" dy="0">2 &lt; 2 là sai: không cộng 18000.</tspan></text></g><text x="594" y="576" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="400" text-anchor="middle"><tspan x="594" dy="0">Gấp lời giải. Tự nói lại luồng chạy.</tspan></text><line x1="64" y1="644" x2="1136" y2="644" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="680" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Tự làm lại với dữ liệu khác, không chỉ chép đáp án.</tspan></text><text x="1136" y="680" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="end"><tspan x="1136" dy="0">MINH + LAN / 03</tspan></text></svg>
