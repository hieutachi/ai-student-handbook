<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="active-learning-title active-learning-desc" xml:lang="vi"><title id="active-learning-title">Giữ bằng chứng của việc hiểu</title><desc id="active-learning-desc">Vòng sáu bước hai hàng: dự đoán, nhận gợi ý, tự sửa, chạy test, giải thích, biến thể; biến thể quay về dự đoán. AI chỉ hỗ trợ ở bước gợi ý.</desc><defs><marker id="active-learning-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="active-learning-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="active-learning-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">THINK FIRST / VÒNG HỌC CHỦ ĐỘNG</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Giữ bằng chứng của việc hiểu</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">AI chỉ gợi ý. Dự đoán, tự sửa và giải thích vẫn là việc của bạn.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><path d="M271 280 H539" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#active-learning-green)" /><path d="M661 280 H929" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#active-learning-green)" /><path d="M1052 280 H1097 Q1120 280 1120 304 V477 Q1120 501 1097 501 H1052" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#active-learning-green)" /><path d="M929 501 H661" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#active-learning-green)" /><path d="M539 501 H271" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#active-learning-green)" /><path d="M149 501 H108 Q80 501 80 475 V306 Q80 280 108 280 H149" fill="none" stroke="#b95132" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#active-learning-rust)" /><circle cx="210" cy="280" r="52" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="210" y="296" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" text-anchor="middle"><tspan x="210" dy="0">01</tspan></text><text x="210" y="369" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="210" dy="0">Dự đoán</tspan></text><text x="210" y="402" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="400" text-anchor="middle"><tspan x="210" dy="0">Viết kết quả trước</tspan></text><circle cx="600" cy="280" r="52" fill="#f2dfa5" stroke="#35634b" stroke-width="2" /><text x="600" y="296" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">02</tspan></text><text x="600" y="369" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Nhận gợi ý</tspan></text><text x="600" y="402" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Hỏi đúng một điểm nghẽn</tspan></text><circle cx="990" cy="280" r="52" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="990" y="296" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" text-anchor="middle"><tspan x="990" dy="0">03</tspan></text><text x="990" y="369" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="990" dy="0">Tự sửa</tspan></text><text x="990" y="402" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="400" text-anchor="middle"><tspan x="990" dy="0">Tự viết phần thay đổi</tspan></text><circle cx="990" cy="501" r="52" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="990" y="517" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" text-anchor="middle"><tspan x="990" dy="0">04</tspan></text><text x="990" y="590" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="990" dy="0">Chạy test</tspan></text><text x="990" y="623" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="400" text-anchor="middle"><tspan x="990" dy="0">So với kỳ vọng</tspan></text><circle cx="600" cy="501" r="52" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="600" y="517" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">05</tspan></text><text x="600" y="590" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Giải thích</tspan></text><text x="600" y="623" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Nói lại khi đóng AI</tspan></text><circle cx="210" cy="501" r="52" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="210" y="517" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" text-anchor="middle"><tspan x="210" dy="0">06</tspan></text><text x="210" y="590" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" text-anchor="middle"><tspan x="210" dy="0">Biến thể</tspan></text><text x="210" y="623" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="400" text-anchor="middle"><tspan x="210" dy="0">Đổi dữ liệu, tự làm lại</tspan></text><text x="600" y="428" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Gợi ý không phải lời giải để chép.</tspan></text><line x1="64" y1="644" x2="1136" y2="644" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="680" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Không nhớ lại được? Ghi điểm nghẽn và thử một biến thể nhỏ.</tspan></text></svg>
