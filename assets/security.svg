<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="security-title security-desc" xml:lang="vi"><title id="security-title">Thu hồi trước. Dọn sau.</title><desc id="security-desc">Sáu bước theo đúng thứ tự trong chương: 01 dừng chia sẻ thêm; 02 thu hồi key ở nhà cung cấp, ô lớn bên trái; 03 kiểm tra mức sử dụng; 04 rà bản liên quan; 05 báo đúng đầu mối; 06 giảm bản lưu và chặn tái diễn, không tự viết lại lịch sử kho mã. Nhãn KEY_DEMO_INVALID không phải key thật.</desc><defs><marker id="security-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="security-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="security-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">SECURITY ALERT / KEY BỊ LỘ</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Thu hồi trước. Dọn sau.</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Xóa chuỗi khỏi tệp không vô hiệu hóa thông tin đã bị lộ.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><circle cx="130" cy="295" r="62" fill="#20342d" /><text x="130" y="312" fill="#f6f3ea" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="400" text-anchor="middle"><tspan x="130" dy="0">02</tspan></text><text x="228" y="283" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="228" dy="0">Thu hồi key</tspan><tspan x="228" dy="43">tại nhà cung cấp</tspan></text><text x="228" y="383" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="228" dy="0">Làm ngay sau bước 01.</tspan><tspan x="228" dy="34">Không chờ dọn Git xong.</tspan></text><g transform="translate(90 466)"><path d="M0 0 H432 L456 24 V129 H0 Z" fill="#f2dfa5" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M432 0 V24 H456" fill="none" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="36" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="24" dy="0">NHÃN GIẢ / KHÔNG PHẢI KEY THẬT</tspan></text><text x="24" y="80" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="27" font-weight="400" text-anchor="start"><tspan x="24" dy="0">KEY_DEMO_INVALID</tspan></text><line x1="20" y1="70" x2="371" y2="70" stroke="#b95132" stroke-width="3" stroke-linecap="round" /><text x="24" y="110" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="24" dy="0">ĐÃ THU HỒI</tspan></text></g><line x1="724" y1="280" x2="724" y2="625" stroke="#35634b" stroke-width="3" stroke-linecap="round" /><circle cx="724" cy="267" r="22" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="724" y="274" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="724" dy="0">01</tspan></text><text x="763" y="264" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="600" text-anchor="start"><tspan x="763" dy="0">Dừng chia sẻ thêm</tspan></text><text x="763" y="294" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="763" dy="0">Không gửi lại tệp, không chụp nguyên key.</tspan></text><circle cx="724" cy="350" r="22" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="724" y="357" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="724" dy="0">03</tspan></text><text x="763" y="347" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="600" text-anchor="start"><tspan x="763" dy="0">Kiểm tra mức sử dụng</tspan></text><text x="763" y="377" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="763" dy="0">Lượt gọi, chi phí, mốc thời gian lạ.</tspan></text><circle cx="724" cy="433" r="22" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="724" y="440" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="724" dy="0">04</tspan></text><text x="763" y="430" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="600" text-anchor="start"><tspan x="763" dy="0">Rà bản liên quan</tspan></text><text x="763" y="460" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="763" dy="0">Commit, cấu hình, ảnh, chat trong phạm vi.</tspan></text><circle cx="724" cy="516" r="22" fill="#dce8d0" stroke="#35634b" stroke-width="2" /><text x="724" y="523" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="724" dy="0">05</tspan></text><text x="763" y="513" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="600" text-anchor="start"><tspan x="763" dy="0">Báo đúng đầu mối</tspan></text><text x="763" y="543" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="763" dy="0">Mô tả sự cố; không đính kèm key.</tspan></text><circle cx="724" cy="599" r="22" fill="#f2dfa5" stroke="#35634b" stroke-width="2" /><text x="724" y="606" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="724" dy="0">06</tspan></text><text x="763" y="596" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="600" text-anchor="start"><tspan x="763" dy="0">Giảm bản lưu, chặn tái diễn</tspan></text><text x="763" y="626" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="763" dy="0">Không tự viết lại lịch sử kho mã.</tspan></text><text x="90" y="662" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Thứ tự: 01 dừng chia sẻ → 02 thu hồi → 03–06 khắc phục.</tspan></text><line x1="64" y1="704" x2="1136" y2="704" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="740" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Ví dụ giả lập; không đưa key thật vào ảnh, prompt hoặc kho mã.</tspan></text></svg>
