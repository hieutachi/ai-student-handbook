<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="final-boss-title final-boss-desc" xml:lang="vi"><title id="final-boss-title">Nâng năng lực, không nâng gói phí</title><desc id="final-boss-desc">Bronze thực hành C++, Silver thực hành Web, Gold nâng quy trình kiểm soát Agent từ một trong hai nhánh: quyền, diff, test, review, khai báo. Không cần trả phí; không có AI có thể mô phỏng thủ công và ghi rõ.</desc><defs><marker id="final-boss-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="final-boss-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="final-boss-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">FINAL BOSS / BA MỨC THỰC HÀNH</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Nâng năng lực, không nâng gói phí</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Gold mở rộng quy trình từ Bronze hoặc Silver, không phải mua công cụ đắt hơn.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><g transform="translate(80 383)"><path d="M0 0 H264 L288 24 V177 H0 Z" fill="#dce8d0" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M264 0 V24 H288" fill="none" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="12" y1="12" x2="12" y2="161" stroke="#35634b" stroke-width="3" stroke-linecap="round" /><text x="28" y="36" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="28" dy="0">BRONZE</tspan></text><text x="28" y="80" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="400" text-anchor="start"><tspan x="28" dy="0">C++</tspan></text><text x="28" y="118" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="28" dy="0">Sửa hai lỗi chủ đích</tspan><tspan x="28" dy="32">Trace + test + bảo vệ</tspan></text></g><line x1="64" y1="571" x2="384" y2="571" stroke="#35634b" stroke-width="4" stroke-linecap="round" /><line x1="80" y1="571" x2="80" y2="603" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><line x1="368" y1="571" x2="368" y2="603" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><g transform="translate(440 330)"><path d="M0 0 H264 L288 24 V177 H0 Z" fill="#dce8d0" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M264 0 V24 H288" fill="none" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="12" y1="12" x2="12" y2="161" stroke="#35634b" stroke-width="3" stroke-linecap="round" /><text x="28" y="36" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="28" dy="0">SILVER</tspan></text><text x="28" y="80" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="400" text-anchor="start"><tspan x="28" dy="0">Web</tspan></text><text x="28" y="118" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="28" dy="0">Theo luồng nhiều tệp</tspan><tspan x="28" dy="32">Sửa lỗi + test + nguồn</tspan></text></g><line x1="424" y1="518" x2="744" y2="518" stroke="#35634b" stroke-width="4" stroke-linecap="round" /><line x1="440" y1="518" x2="440" y2="603" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><line x1="728" y1="518" x2="728" y2="603" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><g transform="translate(800 253)"><path d="M0 0 H296 L320 24 V177 H0 Z" fill="#f2dfa5" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M296 0 V24 H320" fill="none" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="12" y1="12" x2="12" y2="161" stroke="#35634b" stroke-width="3" stroke-linecap="round" /><text x="28" y="36" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="28" dy="0">GOLD</tspan></text><text x="28" y="80" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="400" text-anchor="start"><tspan x="28" dy="0">Kiểm soát Agent</tspan></text><text x="28" y="118" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="28" dy="0">Phạm vi + quyền + diff</tspan><tspan x="28" dy="32">Test + review + khai báo</tspan></text></g><line x1="784" y1="441" x2="1136" y2="441" stroke="#35634b" stroke-width="4" stroke-linecap="round" /><line x1="800" y1="441" x2="800" y2="603" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><line x1="1120" y1="441" x2="1120" y2="603" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><path d="M224 365 V239 H754 Q766 239 766 252 V293 H791" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#final-boss-green)" /><path d="M584 311 V288 H735 Q752 288 752 304 V326 H791" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#final-boss-green)" /><text x="805" y="502" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="805" dy="0">Không có AI?</tspan><tspan x="805" dy="30">Mô phỏng quy trình thủ công.</tspan><tspan x="805" dy="30">Ghi rõ đó là mô phỏng.</tspan></text><rect x="64" y="624" width="1072" height="60" rx="0" fill="#20342d" /><text x="90" y="663" fill="#f6f3ea" font-family="ui-monospace, Consolas, monospace" font-size="23" font-weight="400" text-anchor="start"><tspan x="90" dy="0">KHÔNG CẦN TRẢ PHÍ</tspan></text><text x="462" y="663" fill="#f6f3ea" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="462" dy="0">Đánh giá bằng bài làm và khả năng giải thích.</tspan></text><line x1="64" y1="704" x2="1136" y2="704" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="740" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Làm trên bản sao; giữ nguyên các demo tham khảo.</tspan></text><text x="1136" y="740" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="end"><tspan x="1136" dy="0">HỌC CNTT CÙNG AI</tspan></text></svg>
