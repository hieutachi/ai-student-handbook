<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="debugging-title debugging-desc" xml:lang="vi"><title id="debugging-title">Lượt cuối chưa từng chạy</title><desc id="debugging-desc">Trace n=3, total=0, cận i&lt;n-1: i=0 cộng 35000; i=1 cộng 7000 thành 42000; i=2 không thỏa 2&lt;2, bỏ 18000. Kỳ vọng 60000; sửa cận i&lt;n, validation là bước riêng.</desc><defs><marker id="debugging-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="debugging-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="debugging-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="780" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">MISSION DEBUG / TRACE TỪNG LƯỢT</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Lượt cuối chưa từng chạy</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Dữ liệu: [35000, 7000, 18000] · n = 3 · total khởi đầu bằng 0.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="235" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="27" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Cận sai: i &lt; n - 1  →  i &lt; 2</tspan></text><text x="856" y="235" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="856" dy="0">LỖI CHỦ ĐÍCH</tspan></text><rect x="64" y="269" width="746" height="57" rx="0" fill="#20342d" /><text x="89" y="305" fill="#f6f3ea" font-family="ui-monospace, Consolas, monospace" font-size="21" font-weight="400" text-anchor="start"><tspan x="89" dy="0">i</tspan></text><text x="176" y="305" fill="#f6f3ea" font-family="ui-monospace, Consolas, monospace" font-size="21" font-weight="400" text-anchor="start"><tspan x="176" dy="0">i &lt; 2</tspan></text><text x="364" y="305" fill="#f6f3ea" font-family="ui-monospace, Consolas, monospace" font-size="21" font-weight="400" text-anchor="start"><tspan x="364" dy="0">amounts[i]</tspan></text><text x="632" y="305" fill="#f6f3ea" font-family="ui-monospace, Consolas, monospace" font-size="21" font-weight="400" text-anchor="start"><tspan x="632" dy="0">total</tspan></text><rect x="64" y="479" width="746" height="90" rx="0" fill="#f2dfa5" /><text x="89" y="373" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="89" dy="0">0</tspan></text><text x="176" y="373" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="176" dy="0">đúng</tspan></text><text x="364" y="373" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="364" dy="0">35000</tspan></text><text x="632" y="373" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="632" dy="0">35000</tspan></text><line x1="64" y1="402" x2="810" y2="402" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="89" y="450" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="89" dy="0">1</tspan></text><text x="176" y="450" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="176" dy="0">đúng</tspan></text><text x="364" y="450" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="364" dy="0">7000</tspan></text><text x="632" y="450" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="632" dy="0">42000</tspan></text><line x1="64" y1="479" x2="810" y2="479" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="89" y="527" fill="#b95132" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="89" dy="0">2</tspan></text><text x="176" y="527" fill="#b95132" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="176" dy="0">sai</tspan></text><text x="364" y="527" fill="#b95132" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="364" dy="0">18000</tspan></text><text x="632" y="527" fill="#b95132" font-family="ui-monospace, Consolas, monospace" font-size="25" font-weight="400" text-anchor="start"><tspan x="632" dy="0">42000</tspan></text><text x="364" y="556" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="364" dy="0">bị bỏ, không cộng</tspan></text><line x1="64" y1="570" x2="810" y2="570" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="865" y="296" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="865" dy="0">KẾT QUẢ LỖI</tspan></text><text x="861" y="361" fill="#b95132" font-family="ui-monospace, Consolas, monospace" font-size="48" font-weight="400" text-anchor="start"><tspan x="861" dy="0">42000</tspan></text><line x1="865" y1="393" x2="1110" y2="393" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="865" y="438" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="865" dy="0">KỲ VỌNG</tspan></text><text x="861" y="502" fill="#35634b" font-family="ui-monospace, Consolas, monospace" font-size="48" font-weight="400" text-anchor="start"><tspan x="861" dy="0">60000</tspan></text><text x="64" y="623" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="29" font-weight="400" text-anchor="start"><tspan x="64" dy="0">35000 + 7000 + 18000 = 60000</tspan></text><text x="64" y="670" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Sửa cận thành i &lt; n; kiểm tra dữ liệu đầu vào là bước riêng.</tspan></text><line x1="64" y1="704" x2="1136" y2="704" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="740" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Mảng rỗng không đủ chứng minh vòng lặp đúng.</tspan></text><text x="1136" y="740" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="end"><tspan x="1136" dy="0">HỌC CNTT CÙNG AI</tspan></text></svg>
