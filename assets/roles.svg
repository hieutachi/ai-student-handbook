<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="roles-title roles-desc" xml:lang="vi"><title id="roles-title">Ai làm gì trong một lượt hỏi?</title><desc id="roles-desc">Bốn vai trò xếp Model, Provider, Application, User. Request đi ngược từ User tới Model; response xuôi từ Model tới User. Mũi tên không biểu thị quan hệ sở hữu.</desc><defs><marker id="roles-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="roles-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="roles-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">BEHIND THE SCENE / BỐN VAI TRÒ</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Ai làm gì trong một lượt hỏi?</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Sơ đồ vai trò truy cập đơn giản hóa; không phải quan hệ sở hữu.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="600" y="232" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">REQUEST / NGƯỜI DÙNG GỬI CÂU HỎI ←</tspan></text><text x="600" y="458" fill="#35634b" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">RESPONSE / KẾT QUẢ TRẢ VỀ →</tspan></text><path d="M448 263 H202" fill="none" stroke="#b95132" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-rust)" /><path d="M718 263 H472" fill="none" stroke="#b95132" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-rust)" /><path d="M988 263 H742" fill="none" stroke="#b95132" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-rust)" /><path d="M202 414 H448" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-green)" /><path d="M472 414 H718" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-green)" /><path d="M742 414 H988" fill="none" stroke="#35634b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-green)" /><line x1="190" y1="263" x2="190" y2="288" stroke="#b95132" stroke-width="2" stroke-linecap="round" /><line x1="190" y1="392" x2="190" y2="414" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><line x1="460" y1="263" x2="460" y2="288" stroke="#b95132" stroke-width="2" stroke-linecap="round" /><line x1="460" y1="392" x2="460" y2="414" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><line x1="730" y1="263" x2="730" y2="288" stroke="#b95132" stroke-width="2" stroke-linecap="round" /><line x1="730" y1="392" x2="730" y2="414" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><line x1="1000" y1="263" x2="1000" y2="288" stroke="#b95132" stroke-width="2" stroke-linecap="round" /><line x1="1000" y1="392" x2="1000" y2="414" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><circle cx="163" cy="316" r="5" fill="#35634b" /><circle cx="163" cy="343" r="5" fill="#35634b" /><circle cx="163" cy="370" r="5" fill="#35634b" /><circle cx="190" cy="316" r="5" fill="#35634b" /><circle cx="190" cy="343" r="5" fill="#35634b" /><circle cx="190" cy="370" r="5" fill="#35634b" /><circle cx="217" cy="316" r="5" fill="#35634b" /><circle cx="217" cy="343" r="5" fill="#35634b" /><circle cx="217" cy="370" r="5" fill="#35634b" /><path d="M163 316 L190 343 L217 316" fill="none" stroke="#35634b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M163 343 L190 370 L217 343" fill="none" stroke="#35634b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="416" y="297" width="88" height="24" rx="3" fill="#dce8d0" stroke="#20342d" stroke-width="2" /><circle cx="430" cy="309" r="3" fill="#35634b" /><line x1="447" y1="309" x2="489" y2="309" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><rect x="416" y="329" width="88" height="24" rx="3" fill="#dce8d0" stroke="#20342d" stroke-width="2" /><circle cx="430" cy="341" r="3" fill="#35634b" /><line x1="447" y1="341" x2="489" y2="341" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><rect x="416" y="361" width="88" height="24" rx="3" fill="#dce8d0" stroke="#20342d" stroke-width="2" /><circle cx="430" cy="373" r="3" fill="#35634b" /><line x1="447" y1="373" x2="489" y2="373" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><rect x="679" y="297" width="102" height="87" rx="4" fill="#dce8d0" stroke="#20342d" stroke-width="2" /><line x1="679" y1="317" x2="781" y2="317" stroke="#20342d" stroke-width="2" stroke-linecap="round" /><path d="M695 334 H764 V358 H725 L715 369 V358 H695 Z" fill="#f6f3ea" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1000" cy="321" r="22" fill="#d5a17c" stroke="#20342d" stroke-width="3" /><path d="M960 386 Q959 350 1000 350 Q1041 350 1040 386 Z" fill="#35634b" stroke="#20342d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="190" y="508" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" text-anchor="middle"><tspan x="190" dy="0">Model</tspan></text><text x="190" y="550" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="190" dy="0">Sinh đầu ra</tspan><tspan x="190" dy="31">từ ngữ cảnh</tspan></text><text x="460" y="508" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Provider</tspan></text><text x="460" y="550" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Vận hành dịch vụ</tspan><tspan x="460" dy="31">và quyền truy cập</tspan></text><text x="730" y="508" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" text-anchor="middle"><tspan x="730" dy="0">Application</tspan></text><text x="730" y="550" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="730" dy="0">Tổ chức giao diện</tspan><tspan x="730" dy="31">và ngữ cảnh gửi đi</tspan></text><text x="1000" y="508" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" text-anchor="middle"><tspan x="1000" dy="0">User</tspan></text><text x="1000" y="550" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="1000" dy="0">Gửi yêu cầu</tspan><tspan x="1000" dy="31">nhận, rà kết quả</tspan></text><line x1="64" y1="644" x2="1136" y2="644" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="680" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Một tổ chức có thể đảm nhiệm nhiều vai trò; mũi tên chỉ luồng trao đổi.</tspan></text></svg>
