<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="skill-map-title skill-map-desc" xml:lang="vi"><title id="skill-map-title">Bốn năng lực. Bốn dấu vết.</title><desc id="skill-map-desc">Bốn nhánh bằng chứng quanh tự làm, tự giải thích: bản đồ công cụ; trace, diff, test; dự đoán và bài không AI; phiếu rà dữ liệu, nguồn, quyền và khai báo.</desc><defs><marker id="skill-map-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="skill-map-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="skill-map-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">SKILL UNLOCKED / BẢN ĐỒ BẰNG CHỨNG</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Bốn năng lực. Bốn dấu vết.</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Tự đánh giá bằng việc làm được và giải thích được, không bằng thanh tiến độ.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><path d="M516 365 C450 365 449 294 384 294 M684 365 C753 365 752 294 816 294 M516 447 C448 447 449 529 384 529 M684 447 C752 447 753 529 816 529" fill="none" stroke="#35634b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="600" cy="406" r="90" fill="#dce8d0" stroke="#35634b" stroke-width="3" /><text x="600" y="384" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Tự làm</tspan><tspan x="600" dy="39">Tự giải thích</tspan></text><text x="600" y="458" fill="#35634b" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">BẰNG CHỨNG</tspan></text><g transform="translate(64 220)"><path d="M0 0 H296 L320 24 V157 H0 Z" fill="#f6f3ea" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M296 0 V24 H320" fill="none" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="31" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="20" dy="0">01 / NĂNG LỰC</tspan></text><text x="20" y="70" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" text-anchor="start"><tspan x="20" dy="0">Nhận diện công cụ</tspan></text><text x="20" y="107" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="20" dy="0">Bản đồ vai trò</tspan><tspan x="20" dy="30">Lý do chọn cách truy cập</tspan></text><line x1="0" y1="157" x2="70" y2="157" stroke="#b95132" stroke-width="4" stroke-linecap="round" /></g><g transform="translate(816 220)"><path d="M0 0 H296 L320 24 V157 H0 Z" fill="#f6f3ea" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path