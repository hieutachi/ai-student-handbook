<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="workspace-title workspace-desc" xml:lang="vi"><title id="workspace-title">Bên trong một không gian làm việc</title><desc id="workspace-desc">Khung IDE chứa cây tệp, editor và terminal. Trong terminal, shell nhận python --version và gọi CLI Python. AI hoặc Agent ở ngoài ranh giới quyền đọc, sửa, chạy lệnh.</desc><defs><marker id="workspace-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#20342d" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="workspace-rust" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#b95132" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="workspace-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#35634b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f3ea" /><text x="64" y="48" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">MISSION 01 / MÔI TRƯỜNG</tspan></text><text x="64" y="115" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Bên trong một không gian làm việc</tspan></text><text x="64" y="161" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">IDE chứa editor và terminal; shell nhận lệnh rồi chạy chương trình CLI.</tspan></text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><rect x="64" y="224" width="772" height="371" rx="5" fill="#f6f3ea" stroke="#20342d" stroke-width="2" /><rect x="65" y="225" width="770" height="46" rx="4" fill="#20342d" /><text x="86" y="256" fill="#f6f3ea" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="400" text-anchor="start"><tspan x="86" dy="0">IDE / KHÔNG GIAN DỰ ÁN</tspan></text><rect x="65" y="272" width="170" height="322" rx="0" fill="#dce8d0" /><text x="82" y="308" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="82" dy="0">TỆP</tspan></text><path d="M83 334 h21 l7 8 h101 v38 H83 Z" fill="#f6f3ea" stroke="#35634b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="91" y="366" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="91" dy="0">bai-lam/</tspan></text><line x1="93" y1="394" x2="93" y2="455" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><line x1="93" y1="413" x2="106" y2="413" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><line x1="93" y1="450" x2="106" y2="450" stroke="#35634b" stroke-width="2" stroke-linecap="round" /><text x="112" y="419" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="112" dy="0">main.cpp</tspan></text><text x="112" y="456" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="112" dy="0">test.txt</tspan></text><text x="260" y="307" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="260" dy="0">EDITOR / SOẠN MÃ</tspan></text><text x="261" y="350" fill="#20342d" font-family="ui-monospace, Consolas, monospace" font-size="21" font-weight="400" text-anchor="start"><tspan x="261" dy="0">for (int i = 0; i &lt; n; ++i) {</tspan><tspan x="261" dy="31">    total += amounts[i];</tspan><tspan x="261" dy="31">}</tspan></text><rect x="236" y="436" width="599" height="158" rx="0" fill="#20342d" /><text x="260" y="470" fill="#dce8d0" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="260" dy="0">TERMINAL / VÙNG NHẬP, XUẤT</tspan></text><text x="260" y="512" fill="#f6f3ea" font-family="ui-monospace, Consolas, monospace" font-size="23" font-weight="400" text-anchor="start"><tspan x="260" dy="0">$ python --version</tspan></text><text x="260" y="553" fill="#f6f3ea" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="260" dy="0">Shell gọi CLI Python → nhận đầu ra</tspan></text><g transform="translate(890 247)"><path d="M0 0 H222 L246 24 V303 H0 Z" fill="#f2dfa5" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M222 0 V24 H246" fill="none" stroke="#20342d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="39" fill="#58685f" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="400" text-anchor="start"><tspan x="20" dy="0">AI / AGENT</tspan></text><text x="20" y="86" fill="#20342d" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" text-anchor="start"><tspan x="20" dy="0">Đọc</tspan><tspan x="20" dy="43">Đề xuất sửa</tspan><tspan x="20" dy="43">Xin chạy lệnh</tspan></text><line x1="20" y1="197" x2="223" y2="197" stroke="#20342d" stroke-width="2" stroke-linecap="round" /><text x="20" y="230" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="20" dy="0">Chỉ trong phạm vi</tspan><tspan x="20" dy="32">bạn cho phép.</tspan></text></g><path d="M890 345 H846" fill="none" stroke="#b95132" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#workspace-rust)" /><path d="M858 324 V369" fill="none" stroke="#b95132" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="891" y="588" fill="#20342d" font-family="system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="891" dy="0">Quyền ≠ lời hứa</tspan></text><line x1="64" y1="644" x2="1136" y2="644" stroke="#d4dbcf" stroke-width="2" stroke-linecap="round" /><text x="64" y="680" fill="#58685f" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Lệnh, cây tệp chỉ minh họa. Prompt không tự cấp quyền cho Agent.</tspan></text></svg>
